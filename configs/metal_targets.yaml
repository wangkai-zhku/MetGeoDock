# Open experimental activity sources for the 10 GPDOCK metal ions.
# ChEMBL target IDs are SINGLE PROTEIN entries with catalytic/structural metal
# ions documented in UniProt. Cadmium has few therapeutic assays; the Cd set
# is therefore smaller and is reported separately.
#
# Curation (applied in scripts/data/fetch_chembl_activities.py):
#   assay_type=B, standard_relation='=', pchembl_value present,
#   confidence_score>=8, drop data_validity_comment and potential_duplicate.

metals:
  zn:
    display: Zn(II)
    sources: [chembl, pdbbind_index]
    targets:
      - {chembl_id: CHEMBL1937, uniprot: Q92769, name: HDAC2, pdb: "3MAX"}
      - {chembl_id: CHEMBL325, uniprot: Q13547, name: HDAC1, pdb: "5ICN"}
      - {chembl_id: CHEMBL1865, uniprot: Q9BY41, name: HDAC8, pdb: "2V5W"}
      - {chembl_id: CHEMBL205, uniprot: P00918, name: CA2, pdb: "3CAJ"}
      - {chembl_id: CHEMBL1808, uniprot: P12821, name: ACE, pdb: "1O86"}
      - {chembl_id: CHEMBL321, uniprot: P14780, name: MMP9, pdb: "1GKC"}
      - {chembl_id: CHEMBL280, uniprot: P45452, name: MMP13, pdb: "830C"}
      - {chembl_id: CHEMBL261, uniprot: O15379, name: HDAC3, pdb: "4A69"}
