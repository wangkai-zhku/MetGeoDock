[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metgeodock"
version = "0.1.0"
description = "MetGeoDock: geometry-matching docking for metalloproteins (MetGeo FF, coordinating-water occupancy, 10 metals)"
readme = "README.md"
license = {text = "Academic and non-commercial use only; commercial use requires a separate licence"}
requires-python = ">=3.10"
authors = [
  {name = "Kai Wang"},
]
keywords = [
  "metalloprotein",
  "docking",
  "virtual-screening",
  "geometric-matching",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
chem = ["rdkit>=2023.9"]
plot = ["matplotlib>=3.7"]
ml = [
  "torch>=2.1",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "xgboost>=2.0",
]
prep = [
  "openmm>=8.1",
  "pdbfixer>=1.9",
]
net = ["requests>=2.31"]
docs = ["python-docx>=1.1"]
all = [
  "rdkit>=2023.9",
  "matplotlib>=3.7",
  "torch>=2.1",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "xgboost>=2.0",
  "requests>=2.31",
  "tqdm>=4.66",
  "python-docx>=1.1",
  "openmm>=8.1",
  "pdbfixer>=1.9",
]
dev = ["pytest>=7.4"]

[project.scripts]
metgeodock = "metgeodock.cli:main"

[project.urls]
Homepage = "https://github.com/wangkai-zhku/MetGeoDock"
Source = "https://github.com/wangkai-zhku/MetGeoDock"

[tool.setuptools.packages.find]
include = ["metgeodock*"]

[tool.setuptools.package-data]
metgeodock = ["data/*.json", "data/*.npz"]
